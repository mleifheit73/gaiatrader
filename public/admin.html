<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaia Trader · Motor</title>
<style>
  :root{
    --bg:#0e1412; --panel:#131b18; --line:#24302b; --fg:#e8eceb; --muted:#8d9a95;
    --brand:#2ed4ac; --ok:#3fcf86; --atencao:#e8b339; --perigo:#ff6b5a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
  .wrap{max-width:1060px;margin:0 auto;padding:26px 18px 60px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;
    padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:20px}
  h1{font:700 21px var(--sans);margin:0;letter-spacing:-.02em}
  h1 span{color:var(--brand)}
  h2{font:600 13px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
    margin:26px 0 11px}
  .painel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}

  /* velocimetro */
  .medidor{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:22px;align-items:center}
  @media(max-width:640px){.medidor{grid-template-columns:1fr}}
  .gauge{width:100%;max-width:300px;margin:0 auto;display:block}
  .gauge-num{font:700 38px var(--mono);text-anchor:middle}
  .gauge-un{font:500 12px var(--sans);fill:var(--muted);text-anchor:middle}
  .leitura b{display:block;font:500 11px var(--sans);color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
  .leitura p{margin:0 0 14px;font:500 17px var(--mono)}
  .selo{display:inline-block;font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;
    padding:4px 11px;border-radius:99px;border:1px solid currentColor}
  .ok{color:var(--ok)} .atencao{color:var(--atencao)} .perigo{color:var(--perigo)} .pausado{color:var(--perigo)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
  .card b{display:block;font:500 11px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .card span{font:500 19px var(--mono)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line)}
  td{padding:7px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px}
  tr:last-child td{border-bottom:0}

  .barras{display:flex;align-items:flex-end;gap:3px;height:70px;padding:0 2px}
  .barras i{flex:1;background:var(--brand);border-radius:2px 2px 0 0;min-height:2px;opacity:.75}
  .barras i.falhou{background:var(--perigo)}
  .eixo{display:flex;justify-content:space-between;font:400 10.5px var(--mono);color:var(--muted);margin-top:5px}

  .aviso{padding:12px 14px;border-radius:9px;border-left:3px solid var(--perigo);
    background:color-mix(in srgb,var(--perigo) 10%,transparent);font-size:13.5px;margin-bottom:16px}
  .btn{font:500 13px var(--sans);background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:8px 13px;cursor:pointer}
  .btn:hover{border-color:var(--brand)}
  input{font:500 14px var(--mono);background:#0b100e;color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:9px 12px;width:100%;max-width:420px}
  .entrada{padding:40px 0;max-width:460px}
  .entrada p{color:var(--muted);font-size:13.5px}
  .rodape{margin-top:26px;color:var(--muted);font-size:12.5px;line-height:1.7}
  .nota{color:var(--muted);font-size:12.5px;line-height:1.6;margin:0 0 14px;max-width:70ch}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Gaia <span>Trader</span> · motor</h1>
    <span id="atualizado" style="color:var(--muted);font-size:12.5px"></span>
  </header>

  <div id="conteudo"></div>

</div>

<script>
const K = "gaiatrader_admin_token";
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const hora = (iso) => iso ? new Date(iso).toLocaleString("pt-BR", { dateStyle:"short", timeStyle:"short" }) : "–";

function pedirSenha(mensagem) {
  $("conteudo").innerHTML = `
    <div class="entrada">
      <h2 style="margin-top:0">Acesso ao motor</h2>
      ${mensagem ? `<div class="aviso">${esc(mensagem)}</div>` : ""}
      <p>Informe o segredo de administração. Ele fica guardado apenas neste navegador.</p>
      <input id="tk" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
      <p><button class="btn" id="entrar">Entrar</button></p>
    </div>`;
  const entrar = () => {
    const v = $("tk").value.trim();
    if (!v) return;
    try { localStorage.setItem(K, v); } catch (e) {}
    carregar();
  };
  $("entrar").onclick = entrar;
  $("tk").onkeydown = (e) => { if (e.key === "Enter") entrar(); };
  $("tk").focus();
}

/**
 * Velocímetro: arco de 240 graus, do canto inferior esquerdo ao inferior direito.
 * A faixa colorida mostra onde começa a atenção e onde começa o perigo, para a
 * leitura ser imediata sem precisar interpretar o número.
 */
function velocimetro(pct, nivel, faixas) {
  const R = 86, CX = 110, CY = 110, ABERTURA = 240;
  const ang = (p) => (-210 + (ABERTURA * p) / 100) * (Math.PI / 180);
  const ponto = (p, raio) => [CX + raio * Math.cos(ang(p)), CY + raio * Math.sin(ang(p))];
  const arco = (de, ate, raio, cor, largura) => {
    const [x1, y1] = ponto(de, raio), [x2, y2] = ponto(ate, raio);
    const grande = ((ate - de) / 100) * ABERTURA > 180 ? 1 : 0;
    return `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${raio} ${raio} 0 ${grande} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}"
             fill="none" stroke="${cor}" stroke-width="${largura}" stroke-linecap="round"/>`;
  };
  const cor = { ok:"var(--ok)", atencao:"var(--atencao)", perigo:"var(--perigo)", pausado:"var(--perigo)" }[nivel] || "var(--ok)";
  const [px, py] = ponto(Math.max(0.6, pct), R - 26);

  return `<svg class="gauge" viewBox="0 0 220 180" role="img" aria-label="Consumo de ${pct}% do teto">
    ${arco(0, faixas.atencao, R, "color-mix(in srgb, var(--ok) 28%, transparent)", 13)}
    ${arco(faixas.atencao, faixas.perigo, R, "color-mix(in srgb, var(--atencao) 28%, transparent)", 13)}
    ${arco(faixas.perigo, 100, R, "color-mix(in srgb, var(--perigo) 28%, transparent)", 13)}
    ${pct > 0.5 ? arco(0, pct, R, cor, 13) : ""}
    <line x1="${CX}" y1="${CY}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}"
          stroke="${cor}" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${CX}" cy="${CY}" r="6" fill="${cor}"/>
    <text class="gauge-num" x="${CX}" y="152" fill="${cor}">${pct}%</text>
    <text class="gauge-un" x="${CX}" y="169">do teto que definimos por hora</text>
  </svg>`;
}

function render(d) {
  const L = d.limite;
  const rotulo = { ok:"Tranquilo", atencao:"Atenção", perigo:"Perigo", pausado:"Em recuo" }[L.nivel];

  const maxBarra = Math.max(1, ...(d.consumo_por_hora || []).map((h) => h.n));
  const barras = (d.consumo_por_hora || []).slice().reverse();

  $("atualizado").textContent = "lido às " + hora(d.agora);

  $("conteudo").innerHTML = `
    ${L.pausado ? `<div class="aviso">
        <b>Ingestão em recuo automático até ${esc(hora(L.pausa_ate))}.</b><br>
        Motivo: ${esc(L.pausa_motivo || "não registrado")}.
        <p style="margin:10px 0 0"><button class="btn" id="liberar">Liberar agora</button></p>
      </div>` : ""}

    <section class="painel medidor">
      ${velocimetro(L.percentual, L.nivel, L.faixas)}
      <div class="leitura">
        <span class="selo ${L.nivel}">${rotulo}</span>
        <div style="height:14px"></div>
        <b>Consultas na última hora</b>
        <p>${L.usadas_1h} de ${L.teto_hora}</p>
        <b>Ainda cabem nesta hora</b>
        <p>${L.restantes_na_hora}</p>
        <b>Consultas nas últimas 24 horas</b>
        <p>${L.usadas_24h}</p>
      </div>
    </section>

    <h2>Saúde do provedor</h2>
    <div class="cards">
      <div class="card"><b>Bloqueios 429 em 24h</b><span class="${L.bloqueios_24h ? "perigo" : ""}">${L.bloqueios_24h}</span></div>
      <div class="card"><b>Falhas em 24h</b><span class="${L.falhas_24h ? "atencao" : ""}">${L.falhas_24h}</span></div>
      <div class="card"><b>Ativos com erro</b><span class="${d.totais.com_erro ? "atencao" : ""}">${d.totais.com_erro}</span></div>
      <div class="card"><b>Teto por hora</b><span>${L.teto_hora}</span></div>
    </div>

    ${(d.carregados_sem_candles || []).length ? `<div class="aviso">
        <b>Inconsistência detectada:</b> ${d.carregados_sem_candles.length} ativo(s) marcados como
        carregados sem nenhum candle no banco (${esc(d.carregados_sem_candles.join(", "))}).
        Isso não deveria acontecer nunca. O sistema vai recarregá-los na próxima carga automaticamente.
      </div>` : ""}

    <h2>Base de dados</h2>
    <div class="cards">
      <div class="card"><b>Ativos acompanhados</b><span>${d.totais.ativos}</span></div>
      <div class="card"><b>Já carregados</b><span>${d.totais.carregados}</span></div>
      <div class="card"><b>Faltam carregar</b><span class="${d.faltam_carregar ? "atencao" : ""}">${d.faltam_carregar}</span></div>
      <div class="card"><b>Candles no banco</b><span>${Number(d.totais.barras).toLocaleString("pt-BR")}</span></div>
    </div>

    <h2>Consumo por hora, últimas 24 horas</h2>
    <section class="painel">
      ${barras.length ? `
        <div class="barras">
          ${barras.map((h) => `<i class="${h.falhas ? "falhou" : ""}" style="height:${Math.round((h.n / maxBarra) * 100)}%"
               title="${esc(h.hora)}: ${h.n} consultas, ${h.falhas} falhas"></i>`).join("")}
        </div>
        <div class="eixo"><span>${esc((barras[0] || {}).hora || "")}</span><span>agora</span></div>`
        : `<p style="color:var(--muted);margin:0;font-size:13.5px">Nenhuma consulta nas últimas 24 horas.</p>`}
    </section>

    <h2>Últimas cargas</h2>
    <section class="painel" style="padding:0;overflow-x:auto">
      <table>
        <thead><tr><th>#</th><th>Origem</th><th>Início</th><th>Ok</th><th>Falhas</th><th>Candles</th></tr></thead>
        <tbody>${(d.ultimas_cargas || []).map((c) => `
          <tr><td>${c.id}</td><td>${esc(c.kind)}</td><td>${esc(hora(c.started_at))}</td>
              <td>${c.ok_count}</td><td class="${c.fail_count ? "perigo" : ""}">${c.fail_count}</td>
              <td>${Number(c.bars_written).toLocaleString("pt-BR")}</td></tr>`).join("") ||
          `<tr><td colspan="6" style="color:var(--muted)">Nenhuma carga ainda.</td></tr>`}
        </tbody>
      </table>
    </section>

    ${(d.ativos_com_erro || []).length ? `
      <h2>Ativos com erro</h2>
      <section class="painel" style="padding:0;overflow-x:auto">
        <table>
          <thead><tr><th>Ativo</th><th>Erro</th><th>Quando</th></tr></thead>
          <tbody>${d.ativos_com_erro.map((a) => `
            <tr><td>${esc(a.ticker)}</td><td style="white-space:normal">${esc(a.last_error)}</td>
                <td>${esc(hora(a.last_error_at))}</td></tr>`).join("")}</tbody>
        </table>
      </section>` : ""}

    ${(d.historico_raso || []).length ? `
      <section class="painel">
        <h2>Histórico raso</h2>
        <p class="nota">Ativos carregados com menos histórico do que os 10 anos desejados.
          Foi o defeito que manteve o PETR4 em 2 anos sem ninguém notar.</p>
        <table>
          <thead><tr><th>Ativo</th><th>Período carregado</th><th>1º candle</th></tr></thead>
          <tbody>${d.historico_raso.map((a) => `
            <tr><td>${esc(a.ticker)}</td><td>${esc(a.range_carregado || "não registrado")}</td>
                <td>${esc(a.primeiro_candle || "sem candle")}</td></tr>`).join("")}</tbody>
        </table>
      </section>` : ""}

    <section class="painel">
      <h2>Reparos</h2>
      <p class="nota">Cada reparo é uma ação pontual. A costura de código antigo
        <b>simula primeiro</b>: ela confere se o último preço do código antigo bate com o
        primeiro do código novo. Se não bater, houve conversão de quantidade, e emendar
        sem corrigir a razão criaria um degrau falso que todo indicador leria como
        rompimento. Por isso o botão de aplicar só liga depois de uma simulação.</p>

      <table>
        <thead><tr><th>Reparo</th><th>O que faz</th><th>Ação</th></tr></thead>
        <tbody>
          <tr>
            <td><b>PETR4</b></td>
            <td>Recarrega com 10 anos. Hoje tem 498 candles em vez de 2.491.</td>
            <td><button class="btn" data-recarga="PETR4" data-range="10y">Recarregar</button></td>
          </tr>
          ${[
            ["AURE3", "CESP6", "2022-03-28"],
            ["IGTI11", "IGTA3", "2021-11-22"],
            ["NATU3", "NTCO3", "2025-07-02"],
          ].map(([t, pre, ate]) => `
            <tr>
              <td><b>${t}</b></td>
              <td>Emenda o histórico de <b>${pre}</b>, anterior a ${ate}.
                  Nunca sobrescreve candle existente.</td>
              <td>
                <button class="btn" data-costura="${t}" data-pre="${pre}" data-ate="${ate}" data-aplicar="0">Simular</button>
                <button class="btn" data-costura="${t}" data-pre="${pre}" data-ate="${ate}" data-aplicar="1" disabled>Aplicar</button>
              </td>
            </tr>`).join("")}
          <tr>
            <td><b>Métricas</b></td>
            <td>Apura os indicadores de um lote de ativos e guarda, para a tela de
                rastreamento ler pronto. A varredura noturna já faz isso sozinha;
                este botão serve para conferir antes da hora.</td>
            <td><button class="btn" id="apurar">Apurar lote</button></td>
          </tr>
          <tr>
            <td><b>Outro ativo</b></td>
            <td>
              <input id="rec-ticker" placeholder="TICKER" style="width:90px;font:inherit;padding:4px 6px">
              <input id="rec-range" value="10y" style="width:60px;font:inherit;padding:4px 6px">
            </td>
            <td><button class="btn" id="rec-livre">Recarregar</button></td>
          </tr>
        </tbody>
      </table>

      <pre id="saida-reparo" style="display:none;white-space:pre-wrap;font:12px var(--mono,monospace);
        background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:12px"></pre>
    </section>

    <p class="rodape">
      O teto de ${L.teto_hora} consultas por hora é imposto por nós, não pelo provedor.
      O número mais citado para o Yahoo é 360 por hora, mas não é oficial e não há garantia nenhuma.
      Trabalhamos com uma fração disso de propósito, porque o endereço de saída da Cloudflare é
      compartilhado e podemos ser bloqueados por excesso de terceiros.
      Ao primeiro 429 o sistema para de consultar sozinho por 3 horas.
    </p>`;

  const b = $("liberar");
  if (b) b.onclick = async () => {
    b.disabled = true;
    await fetch("/api/admin/liberar", { method:"POST", headers:{ "x-admin-token": token() } });
    carregar();
  };

  ligarReparos();
}

/*
 * REPAROS
 *
 * Os botões ficam aqui, e não num comando de terminal, por um motivo de
 * segurança: o segredo de administração já está neste navegador e não precisa
 * sair dele nem passar por mais ninguém para que um reparo seja executado.
 */
function mostrarSaida(texto) {
  const el = $("saida-reparo");
  el.style.display = "block";
  el.textContent = texto;
}

async function chamarReparo(rota, parametros, botao) {
  const antes = botao.textContent;
  botao.disabled = true;
  botao.textContent = "...";
  mostrarSaida("Executando " + rota + " " + new URLSearchParams(parametros).toString() + "\n");
  try {
    const r = await fetch(rota + "?" + new URLSearchParams(parametros).toString(), {
      method: "POST",
      headers: { "x-admin-token": token() },
    });
    const corpo = await r.json().catch(() => ({ erro: "resposta ilegível" }));

    // Uma linha em português antes do objeto, porque ninguém deveria precisar
    // ler JSON para saber se pode clicar no botão seguinte.
    let manchete;
    if (!r.ok || corpo?.erro) manchete = "FALHOU: " + (corpo?.erro || "HTTP " + r.status);
    else if (corpo?.emendado) manchete = `EMENDADO: ${corpo.gravadas} candles gravados, ${corpo.preservadas} preservados.`;
    else if (corpo?.modo === "simulacao")
      manchete = `APROVADO NA SIMULAÇÃO: ${corpo.candidatos} candles prontos, ` +
                 `diferença máxima ${corpo.conferencia?.pior_diferenca_pct}% em ` +
                 `${corpo.conferencia?.pregoes_em_comum} pregões. Pode aplicar.`;
    else if (corpo?.motivo) manchete = "RECUSADO: " + corpo.motivo;
    else if (corpo?.barras !== undefined) manchete = `RECARREGADO: ${corpo.barras} candles.`;
    else if (corpo?.linhas !== undefined)
      manchete = `APURADO: ${corpo.ok} ativo(s), ${corpo.linhas} leituras, ` +
                 `${corpo.falhas} falha(s). Faltam ${corpo.faltam_apurar}.`;
    else manchete = "HTTP " + r.status;

    mostrarSaida(manchete + "\n\n" + JSON.stringify(corpo, null, 2));
    return { ok: r.ok, corpo };
  } catch (e) {
    mostrarSaida("Falhou: " + (e?.message || e));
    return { ok: false, corpo: null };
  } finally {
    botao.disabled = false;
    botao.textContent = antes;
  }
}

function ligarReparos() {
  document.querySelectorAll("[data-recarga]").forEach((bt) => {
    bt.onclick = async () => {
      const res = await chamarReparo("/api/admin/recarregar",
        { ticker: bt.dataset.recarga, range: bt.dataset.range }, bt);
      if (res.ok) carregar();
    };
  });

  const apu = $("apurar");
  if (apu) apu.onclick = async () => {
    const res = await chamarReparo("/api/admin/apurar", { lote: 10 }, apu);
    if (res.ok) carregar();
  };

  const livre = $("rec-livre");
  if (livre) livre.onclick = async () => {
    const t = ($("rec-ticker").value || "").trim().toUpperCase();
    const g = ($("rec-range").value || "10y").trim();
    if (!t) return mostrarSaida("Informe o código do ativo.");
    const res = await chamarReparo("/api/admin/recarregar", { ticker: t, range: g }, livre);
    if (res.ok) carregar();
  };

  document.querySelectorAll("[data-costura]").forEach((bt) => {
    bt.onclick = async () => {
      const p = { ticker: bt.dataset.costura, predecessor: bt.dataset.pre, ate: bt.dataset.ate };
      if (bt.dataset.aplicar === "1") p.aplicar = "1";
      const res = await chamarReparo("/api/admin/costurar", p, bt);

      /*
       * O BOTÃO DE APLICAR SÓ LIGA COM SIMULAÇÃO APROVADA.
       *
       * A primeira versão ligava o botão quando a chamada HTTP dava certo, e
       * isso estava errado: uma RECUSA é uma resposta HTTP bem-sucedida
       * carregando um "não". O IGTI11 foi recusado com HTTP 200, o botão
       * habilitou, e o usuário clicou em Aplicar acreditando estar autorizado.
       *
       * Nada foi gravado, porque a recusa acontece no servidor antes de
       * qualquer escrita, mas a tela mentiu sobre o que era permitido. Interface
       * que contradiz a regra do servidor é defeito mesmo quando o servidor
       * segura.
       *
       * O que distingue aprovação de recusa é o campo "modo": só a simulação
       * que passou por todas as conferências o traz.
       */
      const aprovada = res.corpo?.modo === "simulacao";
      const aplicar = document.querySelector(
        `[data-costura="${bt.dataset.costura}"][data-aplicar="1"]`);

      if (bt.dataset.aplicar === "0" && aplicar) {
        aplicar.disabled = !aprovada;
      }
      if (bt.dataset.aplicar === "1" && res.corpo?.emendado) {
        // Emendado de verdade: o reparo acabou, desliga o botão para não repetir.
        if (aplicar) aplicar.disabled = true;
        carregar();
      }
    };
  });
}

const token = () => { try { return localStorage.getItem(K) || ""; } catch (e) { return ""; } };

async function carregar() {
  const t = token();
  if (!t) return pedirSenha();
  try {
    const r = await fetch("/api/admin/metrics", { headers: { "x-admin-token": t } });
    if (r.status === 401) { try { localStorage.removeItem(K); } catch (e) {} return pedirSenha("Segredo incorreto."); }
    if (r.status === 503) return pedirSenha("O segredo ADMIN_TOKEN não está configurado no servidor.");
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    $("conteudo").innerHTML = `<div class="aviso">Não consegui ler as métricas: ${esc(e?.message || e)}</div>`;
  }
}

/*
 * ATUALIZACAO AUTOMATICA QUE PARA QUANDO NINGUEM ESTA OLHANDO.
 *
 * A versao anterior fazia setInterval(carregar, 60000) e pronto: o painel
 * consultava o banco a cada 60 segundos para sempre, mesmo com a aba no fundo,
 * mesmo com a maquina esquecida ligada a noite inteira.
 *
 * Isso custou o orcamento de um dia. A rota de metricas tinha uma contagem que
 * varria as 231 mil linhas da tabela de candles, entao cada atualizacao do
 * painel lia 231 mil linhas, e o limite diario de 5 milhoes do plano gratuito
 * ia embora em 22 minutos de painel aberto. A consulta caneca foi corrigida no
 * servidor, mas corrigir so o servidor seria metade do conserto: continuar
 * consultando uma tela que ninguem esta vendo e desperdicio em qualquer plano.
 *
 * Agora: atualiza so com a aba visivel, e ao voltar para a aba atualiza na hora
 * em vez de esperar o proximo ciclo.
 */
const INTERVALO = 60000;
let timer = null;
let ultimaLeitura = 0;

async function carregarSeVisivel() {
  if (document.visibilityState !== "visible") return;
  ultimaLeitura = Date.now();
  await carregar();
}

function ligarCiclo() {
  if (timer !== null) return;
  timer = setInterval(carregarSeVisivel, INTERVALO);
}

function desligarCiclo() {
  if (timer === null) return;
  clearInterval(timer);
  timer = null;
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    // Ao voltar para a aba, o dado na tela esta velho. Atualiza agora, mas sem
    // disparar duas leituras seguidas se a troca de aba foi rapida.
    if (Date.now() - ultimaLeitura > 5000) carregarSeVisivel();
    ligarCiclo();
  } else {
    desligarCiclo();
  }
});

carregarSeVisivel();
ligarCiclo();
</script>
