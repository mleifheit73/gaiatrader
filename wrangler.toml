name = "gaiatrader"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Arquivos estaticos (a pagina do grafico) servidos pelo proprio Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Banco de dados. O identificador aponta para o banco criado na conta gaiatrader.
[[d1_databases]]
binding = "DB"
database_name = "gaiatrader-db"
database_id = "d0143976-772a-4ca7-92fa-c3fb227effb6"

# UMA varredura por dia, e so.
#
# Das 00h30 as 01h25 UTC, que e das 21h30 as 22h25 de Brasilia. O Brasil nao tem
# horario de verao desde 2019, entao o deslocamento e fixo em UTC-3.
#
# POR QUE 21H30 DE BRASILIA, E NAO 18H30
#
# A primeira versao rodava as 18h30, logo apos o after-market fechar, o que
# parecia o horario obvio. O problema nao e o pregao, e o orcamento: o limite
# diario de leitura do D1 zera a meia-noite UTC, que e 21h de Brasilia.
#
# As 18h30 a varredura competia com tudo que o dia inteiro ja havia consumido, e
# era a primeira a sofrer quando algo gastasse demais. Falhou duas vezes
# seguidas por isso, sem conseguir nem ler o banco para saber o que carregar.
#
# As 21h30 ela roda nos primeiros minutos de um orcamento zerado, com os
# 5 milhoes de linhas inteiros a disposicao. O candle continua igualmente
# definitivo, porque o pregao regular fecha as 17h e o after-market as 18h.
#
# A licao geral: tarefa critica que roda em plano com cota diaria deve rodar
# LOGO APOS a virada da cota, nunca perto do fim dela.
#
# Sao 12 execucoes de 5 em 5 minutos, cada uma com um lote dos ativos mais
# desatualizados. Bastam 5 para cobrir os 96; as demais nao fazem nada porque
# nao sobra ativo desatualizado. A folga absorve falha de rede sem perder o dia.
#
# Fora dessa janela o sistema NAO varre nada. A atualizacao durante o dia e sob
# demanda: so busca o ativo que alguem esta olhando, e so se o dado estiver
# velho. Isso faz o consumo acompanhar o uso real em vez do tamanho do catalogo,
# que e a unica forma de ficar bem longe do limite do provedor.
#
# Todos os dias, nao so em dia util, porque cripto negocia no fim de semana.
[triggers]
crons = ["30,35,40,45,50,55 0 * * *", "0,5,10,15,20,25 1 * * *"]

[vars]
# Provedor de cotacoes em uso. Trocar aqui quando houver licenca comercial.
DATA_PROVIDER = "yahoo"
# Endereco de suporte mostrado ao usuario. Fica como configuracao para que a
# troca para suporte@gaiatrader.com.br custe uma linha.
SUPORTE_EMAIL = "contato@gaiatrader.com.br"

# Segredos (NAO ficam neste arquivo). Defina com:
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put ANTHROPIC_API_KEY   (a partir da Fase 3)
