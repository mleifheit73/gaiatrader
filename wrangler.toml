name = "gaiatrader"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Arquivos estaticos (a pagina do grafico) servidos pelo proprio Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Banco de dados. O identificador aponta para o banco criado na conta gaiatrader.
[[d1_databases]]
binding = "DB"
database_name = "gaiatrader-db"
database_id = "d0143976-772a-4ca7-92fa-c3fb227effb6"

# Janela de carga: de 5 em 5 minutos, das 21h as 21h55 UTC, que e das 18h as
# 18h55 de Brasilia. O Brasil nao tem horario de verao desde 2019, entao o
# deslocamento e fixo em UTC-3 o ano inteiro.
#
# Sao 12 execucoes, e cada uma processa um lote dos ativos mais desatualizados.
# Com 96 ativos e lote de 20, bastam 5 execucoes para cobrir o mercado inteiro;
# as demais nao fazem nada, porque nao sobra ativo desatualizado para buscar.
# A janela com folga existe para absorver falha de rede sem perder o dia.
#
# Todos os dias, e nao so em dia util, porque cripto negocia no fim de semana.
# Nesses dias a B3 e buscada a toa, mas a escrita e idempotente e o custo e nulo.
[triggers]
crons = ["*/5 21 * * *"]

[vars]
# Provedor de cotacoes em uso. Trocar aqui quando houver licenca comercial.
DATA_PROVIDER = "yahoo"
# Endereco de suporte mostrado ao usuario. Fica como configuracao para que a
# troca para suporte@gaiatrader.com.br custe uma linha.
SUPORTE_EMAIL = "info@gaiabelle.com"

# Segredos (NAO ficam neste arquivo). Defina com:
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put ANTHROPIC_API_KEY   (a partir da Fase 3)
